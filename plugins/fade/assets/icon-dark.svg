<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 136" role="img" aria-label="Fade video frames"><title>Fade — compact matched frames</title><defs></defs><g><defs><linearGradient id="frameShade" x1="0" y1="18" x2="0" y2="118" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF70B7"/><stop offset=".28" stop-color="#FA53AA"/><stop offset=".62" stop-color="#ED2A93"/><stop offset="1" stop-color="#D72180"/></linearGradient><filter id="frameRelief" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="0.35" result="soft"/>
<feOffset in="soft" dy="0.55" result="down"/>
<feComposite in="SourceAlpha" in2="down" operator="out" result="topEdge"/>
<feFlood flood-color="#FFF1F6" flood-opacity=".50" result="light"/>
<feComposite in="light" in2="topEdge" operator="in" result="highlight"/>
<feOffset in="soft" dy="-0.55" result="up"/>
<feComposite in="SourceAlpha" in2="up" operator="out" result="bottomEdge"/>
<feFlood flood-color="#9E123F" flood-opacity=".26" result="shade"/>
<feComposite in="shade" in2="bottomEdge" operator="in" result="edgeShade"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="edgeShade"/><feMergeNode in="highlight"/></feMerge>
</filter></defs><defs>
<linearGradient id="foldShade" x1="0" y1="18" x2="0" y2="118" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF70B7"/><stop offset=".28" stop-color="#FA53AA"/><stop offset=".62" stop-color="#ED2A93"/><stop offset="1" stop-color="#D72180"/></linearGradient>


